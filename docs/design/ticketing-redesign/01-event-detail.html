<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroGroove — Event Detail (Neon Editorial) — APPROVED REFERENCE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#020006;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:32px;font-family:Outfit,system-ui,sans-serif}
  .frame{width:380px;border-radius:18px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6)}
  /* ===== APPROVED: Direction A — Neon Editorial ===== */
  .detail{font-family:Outfit,system-ui,sans-serif;background:#08020e;color:#ECE6F0}
  .hero{position:relative;height:200px;background:
      radial-gradient(120% 85% at 50% 0%,rgba(255,20,147,.42),transparent 60%),
      radial-gradient(70% 60% at 82% 8%,rgba(0,229,255,.28),transparent 55%),
      linear-gradient(180deg,#1c0628,#08020e)}
  .hero .preventa{position:absolute;left:18px;top:16px;font:600 .62rem/1 Outfit;letter-spacing:.18em;color:#00e5ff;text-transform:uppercase}
  .hero .titles{position:absolute;left:18px;bottom:16px;right:18px}
  .hero .t1{font-family:'Bebas Neue',Impact,sans-serif;font-size:2.4rem;line-height:.95;letter-spacing:.02em}
  .hero .t2{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.4rem;color:#ffd700;letter-spacing:.04em}
  .body{padding:18px 20px}
  .date{font:600 .68rem/1 Outfit;letter-spacing:.16em;color:#00e5ff;text-transform:uppercase}
  .venue{font-size:.85rem;color:rgba(236,230,240,.6);margin-top:5px}
  .rule{height:1px;background:rgba(255,255,255,.08);margin:15px 0}
  .price-row{display:flex;align-items:baseline;gap:9px}
  .desde{font:600 .58rem/1 Outfit;letter-spacing:.14em;color:rgba(236,230,240,.45);text-transform:uppercase}
  .price{font-family:'Bebas Neue',Impact,sans-serif;font-size:2rem;color:#ffd700}
  .tiers{margin:14px 0 4px}
  .tier{display:flex;justify-content:space-between;padding:9px 0;font-size:.85rem;border-bottom:1px solid rgba(255,255,255,.07)}
  .tier:last-child{border-bottom:0}
  .tier .p{color:#ff1493;font-weight:600}
  .cta{margin-top:14px;background:#ff1493;color:#fff;text-align:center;padding:13px;border-radius:999px;
       font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;font-size:1.2rem;box-shadow:0 0 22px rgba(255,20,147,.45)}
</style>
</head>
<body>
  <div class="frame">
    <div class="detail">
      <div class="hero">
        <div class="preventa">● Preventa · hasta agotar stock</div>
        <div class="titles">
          <div class="t1">GRUPO 5</div>
          <div class="t2">NOCHE DE CUMBIA</div>
        </div>
      </div>
      <div class="body">
        <div class="date">SÁB 27 DIC · 9:00 PM</div>
        <div class="venue">Arena 1 · Lima</div>
        <div class="rule"></div>
        <div class="price-row"><span class="desde">Desde</span><span class="price">S/ 70.00</span></div>
        <div class="tiers">
          <div class="tier"><span>VIP Frente al Escenario</span><span class="p">S/ 120</span></div>
          <div class="tier"><span>Mesas Generales</span><span class="p">S/ 70</span></div>
        </div>
        <div class="cta">COMPRAR ENTRADAS</div>
      </div>
    </div>
  </div>
</body>
</html>
