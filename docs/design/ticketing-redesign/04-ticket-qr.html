<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroGroove — Digital Ticket + QR — APPROVED REFERENCE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#020006;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;font-family:Outfit,system-ui,sans-serif}
  .wrap{width:360px;max-width:100%}
  .ticket{border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;background:
      radial-gradient(120% 60% at 50% 0%,rgba(255,20,147,.18),transparent 60%),#0b0118;color:#ECE6F0}
  .head{padding:16px 16px 12px}
  .toprow{display:flex;justify-content:space-between;align-items:center}
  .brand{font:600 .58rem/1 Outfit;letter-spacing:.14em;color:#00e5ff;text-transform:uppercase}
  .status{font-size:.66rem;padding:3px 10px;border-radius:999px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.5);color:#22c55e;font-weight:600}
  .t1{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.6rem;line-height:1;margin-top:10px}
  .t2{font-family:'Bebas Neue',Impact,sans-serif;font-size:1rem;color:#ffd700}
  .when{font-size:.72rem;color:rgba(236,230,240,.6);margin-top:6px}
  .seatinfo{display:flex;gap:14px;margin-top:8px;font-size:.68rem;color:rgba(236,230,240,.75)}
  .seatinfo .k{color:rgba(236,230,240,.4)}
  .perf{position:relative;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px);margin:4px 0}
  .qrwrap{padding:16px;text-align:center}
  .qrbox{display:inline-block;background:#fff;padding:12px;border-radius:12px}
  .qr{width:130px;height:130px;background:#fff;background-image:repeating-conic-gradient(#000 0 25%,#fff 0 50%);background-size:13px 13px;border-radius:4px}
  .codelab{font:600 .55rem/1 Outfit;letter-spacing:.14em;color:rgba(236,230,240,.45);text-transform:uppercase;margin-top:12px}
  .code{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.32em;color:#ffd700;font-size:1.4rem;margin-top:3px}
  .anti{margin-top:12px;font-size:.6rem;color:rgba(236,230,240,.4)}
  .actions{margin-top:10px;display:flex;gap:8px}
  .ghost{flex:1;text-align:center;padding:9px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:rgba(236,230,240,.9);font-size:.78rem}
  .solid{flex:1;text-align:center;padding:9px;border-radius:999px;background:#ff1493;color:#fff;font-size:.78rem;font-weight:600}
</style>
</head>
<body>
<!--
  QR sits on a LIGHT patch so scanners read it on the dark card (design guardrail).
  Status badge: Válida (green #22c55e) / Usada (red #ff5a6e).
  DEFERRED (Phase 2, recommended): DICE-style "Activar entrada" time-gate (QR unlocks ~2h before
  doors, animated/screenshot-proof) and real Apple/Google Wallet passes. Ship always-visible QR now.
  The "Agregar a Wallet" button below is shown but stubbed until wallet-pass plumbing exists.
-->
  <div class="wrap">
    <div class="ticket">
      <div class="head">
        <div class="toprow"><span class="brand">RetroGroove</span><span class="status">● Válida</span></div>
        <div class="t1">GRUPO 5</div>
        <div class="t2">NOCHE DE CUMBIA</div>
        <div class="when">Sáb 27 Dic · 9:00 PM · Arena 1, Lima</div>
        <div class="seatinfo">
          <span><span class="k">Zona</span> VIP</span>
          <span><span class="k">Mesa</span> 1</span>
          <span><span class="k">Asientos</span> N, E</span>
        </div>
      </div>
      <div class="perf"></div>
      <div class="qrwrap">
        <div class="qrbox"><div class="qr"></div></div>
        <div class="codelab">Código de entrada</div>
        <div class="code">RG-7K4P-29</div>
        <div class="anti">Entrada al portador · primer escaneo válido · no compres a revendedores</div>
      </div>
    </div>
    <div class="actions">
      <div class="ghost">Agregar a Wallet</div>
      <div class="solid">Compartir</div>
    </div>
  </div>
</body>
</html>
